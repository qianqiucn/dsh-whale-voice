name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild client bundle
        run: node build.mjs

      - name: Syntax checks
        run: |
          node --check client.js
          node --check client.template.js
          node --check pages.js
          node --check setup.js
          node --check build.mjs
          node --check index.js
          node --check core/detect.mjs
          node --check core/config.mjs
          node --check core/config-sandbox.mjs
          node --check core/config-schema.mjs
          node --check core/config-store.mjs
          node --check core/config-coordinator.mjs
          node --check core/isolated-write-server.mjs
          node --check core/http.mjs
          node --check core/request-guards.mjs
          node --check core/view.mjs
          node --check core/setup-status.mjs
          node --check core/server.mjs
          node --check packages/adapter-wechatagent/index.mjs

      - name: Contract tests
        run: node --test

      - name: Generated client is in sync
        run: git diff --exit-code -- client.js

  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked UI test dependencies
        run: npm ci --prefix tests/ui --no-audit --no-fund

      - name: Install Chromium for the pinned Playwright
        run: node tests/ui/node_modules/playwright/cli.js install --with-deps chromium

      - name: Rebuild client bundle
        run: node build.mjs

      - name: Isolated UI harness
        run: node tests/ui/run.mjs

      - name: Upload UI test artifacts (fictional fixtures only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whale-voice-ui-artifacts
          path: tests/ui/.artifacts/
          include-hidden-files: true
          if-no-files-found: warn
